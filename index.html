    ];

  function loadAll() {
    const load = (src) => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = src;
    });
    return Promise.all([
      Promise.all(BOY_SRC.map(load)),
      Promise.all(DOG_SRC.map(load))
    ]).then(([b, d]) => {
      BOY_IMG.push(...b);
      DOG_IMG.push(...d);
    });
  }

  /* ---------- drawing helpers ---------- */
  function ink() { ctx.strokeStyle = "#201410"; ctx.fillStyle = "#201410"; }
  function creamFill() { ctx.fillStyle = "#FAF6EC"; }
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function shadowAt(x, y, rx) {
    ctx.save();
    ctx.fillStyle = "rgba(40,24,14,0.13)";
    ctx.beginPath();
    ctx.ellipse(x, y - 4, rx, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

    g.addColorStop(1, "#EFE6D6");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // distant buildings
    ctx.save();
    ctx.translate(-cam * 0.25, 0);
    const blds = [
      { x: 40, w: 220, h: 260, win: 4 },
      { x: 280, w: 180, h: 200, win: 3 },
      { x: 500, w: 260, h: 300, win: 5 },
      { x: 820, w: 200, h: 230, win: 3 },
      { x: 1100, w: 240, h: 270, win: 4 },
      { x: 1400, w: 180, h: 210, win: 3 }
    ];
    for (let k = 0; k < 3; k++) {
      for (const b of blds) {
        const x = b.x + k * 1600;
        const y = 430 - b.h;
        ctx.fillStyle = "#E4D9C8";
        ctx.strokeStyle = "#C9B9A4";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(x, y, b.w, b.h);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(180,150,120,0.28)";
        const cols = b.win, rows = Math.max(3, Math.floor(b.h / 48));
        const mw = 12, mh = 16, gx = (b.w - cols * mw) / (cols + 1), gy = 28;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            ctx.fillRect(x + gx + c * (mw + gx), y + 18 + r * gy, mw, mh);
          }
        }
      }
    }
    ctx.restore();

    // back fence
    ctx.save();
    const fenceY = 668;
    ctx.beginPath();
    ctx.strokeStyle = "#8A7B6A";
    ctx.lineWidth = 3;
    ctx.moveTo(0, fenceY);
    ctx.lineTo(W, fenceY);
    ctx.stroke();
    const fs = -((cam * 0.85) % 28);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#9A8B7A";
    for (let x = fs; x < W + 28; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, fenceY - 62);
      ctx.lineTo(x, fenceY);
      ctx.stroke();
    }
    ctx.strokeStyle = "#8A7B6A";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, fenceY - 62);
    ctx.lineTo(W, fenceY - 62);
    ctx.stroke();
    ctx.restore();

    // grass strip
    ctx.fillStyle = "#D5DEC4";
    ctx.fillRect(0, 700, W, 86);
    ctx.fillStyle = "#C9D4B4";
    for (let i = 0; i < 18; i++) {
      const x = ((i * 97 - cam * 0.5) % (W + 80)) - 40;
      ctx.beginPath();
      ctx.ellipse(x, 744, 18, 7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // curb
    ctx.fillStyle = "#E8DCC8";
    ctx.fillRect(0, 786, W, 18);
    ctx.strokeStyle = "#D2C4AE";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 786);
    ctx.lineTo(W, 786);
    ctx.stroke();

    // pavement
    ctx.fillStyle = "#EDE4D4";
    ctx.fillRect(0, 804, W, GROUND - 804 + 80);
    ctx.strokeStyle = "rgba(196,180,156,0.55)";
    ctx.lineWidth = 1.5;
    const tileW = 90, tileH = 44;
    const ox = -((cam) % tileW);
    const startRow = 804;
    for (let y = startRow; y < GROUND + 70; y += tileH) {
      const shift = Math.floor((y - startRow) / tileH) % 2 ? tileW / 2 : 0;
      for (let x = ox - tileW + shift; x < W + tileW; x += tileW) {
        ctx.strokeRect(x, y, tileW, tileH);
      }
    }

    // ground line
    ctx.strokeStyle = "#CDBBA3";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND + 2);
    ctx.lineTo(W, GROUND + 2);
    ctx.stroke();
  }

  function worldX(x) { return x - camX; }

  function drawTree(wx, baseY) {
    const x = worldX(wx);
    if (x < -160 || x > W + 160) return;
    ctx.save();
    // trunk
    ctx.fillStyle = "#6B4F38";
    ctx.strokeStyle = "#201410";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - 14, baseY);
    ctx.lineTo(x - 8, baseY - 130);
    ctx.lineTo(x + 10, baseY - 130);
    ctx.lineTo(x + 16, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // canopy
    const blobs = [
      [0, -210, 78], [-48, -180, 58], [50, -176, 62], [-20, -250, 54], [28, -248, 50], [0, -175, 64]
    ];
    ctx.fillStyle = "#8FA873";
    ctx.strokeStyle = "#3D4A32";
    ctx.lineWidth = 2.5;
    for (const [dx, dy, r] of blobs) {
      ctx.beginPath();
      ctx.arc(x + dx, baseY + dy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlanter(wx) {
    const x = worldX(wx);
    if (x < -120 || x > W + 120) return;
    const y = 700;
    ctx.save();
    ctx.fillStyle = "#C46A4A";
    ctx.strokeStyle = "#201410";
    ctx.lineWidth = 2.5;
    roundRect(x - 54, y, 108, 54, 4);
    ctx.fill();
    ctx.stroke();
    // brick lines
    ctx.strokeStyle = "rgba(80,30,20,0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 54, y + 27);
    ctx.lineTo(x + 54, y + 27);
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 54);
    ctx.stroke();
    // plants
    ctx.fillStyle = "#6F8F55";
    ctx.strokeStyle = "#334226";
    ctx.lineWidth = 2;
    for (const dx of [-28, 0, 28]) {
      ctx.beginPath();
      ctx.ellipse(x + dx, y - 10, 16, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStartWall() {
    const x = worldX(-40);
    ctx.save();
    ctx.fillStyle = "#E8D5C0";
    ctx.strokeStyle = "#201410";
    ctx.lineWidth = 3;
    ctx.fillRect(x - 80, 420, 140, GROUND - 420);
    ctx.strokeRect(x - 80, 420, 140, GROUND - 420);
    // brick pattern
    ctx.strokeStyle = "rgba(80,50,30,0.25)";
    ctx.lineWidth = 1;
    for (let y = 430; y < GROUND; y += 28) {
      ctx.beginPath();
      ctx.moveTo(x - 80, y);
      ctx.lineTo(x + 60, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGate() {
    const x = worldX(GATE_X);
    if (x < -220 || x > W + 220) return;
    const base = GROUND;
    ctx.save();
    // pillars
    ctx.fillStyle = "#E8D5C0";
    ctx.strokeStyle = "#201410";
    ctx.lineWidth = 3;
    ctx.fillRect(x - 150, 430, 54, base - 430);
    ctx.strokeRect(x - 150, 430, 54, base - 430);
    ctx.fillRect(x + 96, 430, 54, base - 430);
    ctx.strokeRect(x + 96, 430, 54, base - 430);
    // caps
    ctx.fillStyle = "#6B4F38";
    ctx.fillRect(x - 160, 410, 74, 28);
    ctx.strokeRect(x - 160, 410, 74, 28);
    ctx.fillRect(x + 86, 410, 74, 28);
    ctx.strokeRect(x + 86, 410, 74, 28);
    // lintel
    ctx.fillStyle = "#6B4F38";
    ctx.fillRect(x - 160, 360, 320, 52);
    ctx.strokeStyle = "#201410";
    ctx.strokeRect(x - 160, 360, 320, 52);
    ctx.fillStyle = "#FAF6EC";
    ctx.font = "600 28px 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("小区门口", x, 386);
    // open path suggestion
    ctx.fillStyle = "rgba(250,246,236,0.35)";
    ctx.fillRect(x - 96, 430, 192, base - 430);
    ctx.restore();
  }

  function drawProps() {
    drawStartWall();
    drawTree(430, 700);
    drawPlanter(620);
    drawTree(1180, 700);
    drawPlanter(1320);
    drawPlanter(1880);
    drawTree(2220, 700);
    drawPlanter(2380);
    drawGate();
  }

  function drawNPC(npc) {
    const x = worldX(npc.x);
    const y = GROUND - npc.asideY;
    if (x < -90 || x > W + 90) return;
    const facing = npc.dir;
    const swing = Math.sin(npc.phase * 7.2) * 13;
    const isWoman = npc.kind === "woman";
    shadowAt(x, y, isWoman ? 20 : 22);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * 1.18, 1.18);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = "#201410";
    ctx.lineWidth = 2.8;

    const hipY = isWoman ? -90 : -96;
    const backX = swing * -0.9;
    const frontX = swing * 0.9;
    // legs
    ctx.beginPath();
    ctx.moveTo(-5, hipY);
    ctx.lineTo(-6 + backX * 0.55, hipY * 0.48);
    ctx.lineTo(backX, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(5, hipY);
    ctx.lineTo(7 + frontX * 0.55, hipY * 0.48);
    ctx.lineTo(12 + frontX, 0);
    ctx.stroke();
    // shoes, pointing right (local facing)
    ctx.fillStyle = "#201410";
    ctx.beginPath();
    ctx.ellipse(backX + 6, 2, 12, 4.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(12 + frontX + 6, 2, 12, 4.4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (isWoman) {
      // profile coat, hem at mid-thigh so legs stay visible
      ctx.fillStyle = "#C45C4A";
      ctx.beginPath();
      ctx.moveTo(-15, -112);
      ctx.lineTo(-18, -78);
      ctx.lineTo(-24, -36);
      ctx.lineTo(20, -36);
      ctx.lineTo(16, -78);
      ctx.lineTo(12, -112);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(1, -108);
      ctx.lineTo(3, -36);
      ctx.stroke();
      // scarf
      ctx.fillStyle = "#E8D9B8";
      ctx.beginPath();
      ctx.ellipse(1, -114, 17, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(10, -112);
      ctx.quadraticCurveTo(24, -90, 14, -64);
      ctx.quadraticCurveTo(8, -88, 10, -112);
      ctx.fill();
      ctx.stroke();
    } else {
      // jacket
      ctx.fillStyle = "#4A5568";
      ctx.beginPath();
      ctx.moveTo(-16, -114);
      ctx.lineTo(-19, -58);
      ctx.lineTo(-15, -30);
      ctx.lineTo(17, -30);
      ctx.lineTo(19, -58);
      ctx.lineTo(13, -114);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // arms
    ctx.strokeStyle = "#201410";
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(-8, -106);
    ctx.quadraticCurveTo(-20, -80 - swing * 0.15, -16, -54 - swing * 0.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(8, -106);
    ctx.quadraticCurveTo(22, -78 + swing * 0.15, 18, -52 + swing * 0.4);
    ctx.stroke();

    // head
    ctx.fillStyle = "#F3E0C8";
    ctx.lineWidth = 2.8;
    const hy = isWoman ? -146 : -152;
    ctx.beginPath();
    ctx.arc(2, hy, 21, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (isWoman) {
      ctx.fillStyle = "#2A1C14";
      ctx.beginPath();
      ctx.arc(0, hy - 8, 17, Math.PI * 0.95, Math.PI * 0.08, false);
      ctx.lineTo(18, hy + 10);
      ctx.lineTo(-14, hy + 12);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-17, hy - 8, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#201410";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(-17, hy - 8, 8, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#2A1C14";
      ctx.beginPath();
      ctx.arc(2, hy, 21.6, Math.PI * 0.78, -0.38, true);
      ctx.quadraticCurveTo(6, hy - 6, -2, hy + 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function boyFrame() {
    return (state === "play" && Math.abs(boyVx) > 8) ? (Math.floor(animT / 0.09) % 8) : 0;
  }
  function dogFrame() {
    const moving = state === "play" && Math.abs(dogX - (boyX + DOG_LEAD)) > 2 || Math.abs(boyVx) > 8;
    return moving ? (Math.floor(dogAnimT / 0.09) % 8) : 0;
  }

  function handPos() {
    const img = BOY_IMG[boyFrame()] || BOY_IMG[0];
    const bw = img ? img.width * (BOY_H / img.height) : 110;
    return { x: boyX + 22, y: GROUND - 96 };
  }
  function collarPos() {
    const img = DOG_IMG[dogFrame()] || DOG_IMG[0];
    const dw = img ? img.width * (DOG_H / img.height) : 120;
    return { x: dogX + dw * 0.20, y: GROUND - DOG_H * 0.60 };
  }

  function drawLeash(broken) {
    const h = handPos();
    const c = collarPos();
    const hx = worldX(h.x), hy = h.y;
    const cx = worldX(c.x), cy = c.y;
    const dist = Math.hypot(c.x - h.x, c.y - h.y);
    const taut = Math.max(0, (dist - 90) / (LEASH_MAX - 90));
    const sag = (1 - taut) * 36 + 8;
    const mx = (hx + cx) / 2;
    const my = (hy + cy) / 2 + sag;
    if (broken && snapT > 0) {
      ctx.strokeStyle = "#9A2B1A";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      const t = Math.min(1, snapT);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo(mx - 20, my + 30 * t, hx + (mx - hx) * 0.7, hy + 40 * t);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(mx + 20, my + 30 * t, cx - (cx - mx) * 0.7, cy + 40 * t);
      ctx.stroke();
      return;
    }
    const hot = leashTension > 0.08;
    ctx.strokeStyle = hot ? "#C43C2A" : "#3A2A20";
    ctx.lineWidth = hot ? 3.2 : 2.4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.quadraticCurveTo(mx, my, cx, cy);
    ctx.stroke();
  }

  function drawBoy() {
    const img = BOY_IMG[boyFrame()];
    if (!img) return;
    const h = BOY_H;
    const w = img.width * (h / img.height);
    const x = worldX(boyX);
    shadowAt(x, GROUND, 28);
    ctx.drawImage(img, x - w / 2, GROUND - h, w, h);
  }
  function drawDog() {
    const img = DOG_IMG[dogFrame()];
    if (!img) return;
    const h = DOG_H;
    const w = img.width * (h / img.height);
    const x = worldX(dogX);
    shadowAt(x, GROUND, 22);
    ctx.drawImage(img, x - w / 2, GROUND - h, w, h);
    if (barkFlash > 0) {
      const a = Math.min(1, barkFlash / 0.25);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = "#FAF6EC";
      ctx.strokeStyle = "#201410";
      ctx.lineWidth = 2.5;
      const bx = x + 36, by = GROUND - h - 28;
      roundRect(bx, by, 52, 32, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#201410";
      ctx.font = "700 18px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("汪！", bx + 26, by + 17);
      ctx.restore();
    }
  }

  /* ---------- UI ---------- */
  const walkBtn = { x: 250, y: 1128, w: 420, h: 96 };
  const barkBtn = { x: 50, y: 1128, w: 180, h: 96 };
  const pauseBtn = { x: 640, y: 28, w: 52, h: 52 };

  function inRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  function starsEarned() {
    if (maxTension < 0.18 && bumps === 0) return 3;
    if (maxTension < 0.45 && bumps <= 2) return 2;
    return 1;
  }

  function drawStars(cx, cy, n, size, dim) {
    ctx.save();
    ctx.font = `700 ${size}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const gap = size * 0.95;
    const start = cx - gap;
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < n ? "#E2A62A" : (dim ? "rgba(80,60,40,0.22)" : "rgba(80,60,40,0.25)");
      ctx.fillText("★", start + i * gap, cy);
    }
    ctx.restore();
  }

  function drawTopBar() {
    ctx.save();
    ctx.fillStyle = "rgba(250,246,236,0.88)";
    roundRect(24, 20, 672, 68, 18);
    ctx.fill();
    ctx.strokeStyle = "rgba(32,20,16,0.18)";
    ctx.lineWidth = 2;
    roundRect(24, 20, 672, 68, 18);
    ctx.stroke();
    ctx.fillStyle = "#2A1C14";
    ctx.font = "600 26px 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("1-1  小区门口", 48, 54);
    const shown = state === "win" ? winStars : (state === "play" || state === "pause" ? starsEarned() : 0);
    // live stars only fill on win; during play show empty + preview? show current potential
    if (state === "win") drawStars(360, 54, winStars, 28, true);
    else if (state === "play" || state === "pause" || state === "fail") drawStars(360, 54, 0, 28, true);
    else drawStars(360, 54, 0, 28, true);
    // pause icon
    ctx.fillStyle = "#2A1C14";
    if (state === "play" || state === "pause") {
      if (state === "pause") {
        // play triangle
        ctx.beginPath();
        ctx.moveTo(654, 40);
        ctx.lineTo(654, 68);
        ctx.lineTo(678, 54);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(654, 40, 7, 28);
        ctx.fillRect(668, 40, 7, 28);
      }
    }
    ctx.restore();
  }

  function drawBottom() {
    if (state !== "play") return;
    // bark
    const cd = barkCD > 0;
    ctx.save();
    ctx.fillStyle = cd ? "rgba(42,28,20,0.28)" : "#2A1C14";
    roundRect(barkBtn.x, barkBtn.y, barkBtn.w, barkBtn.h, 20);
    ctx.fill();
    ctx.fillStyle = "#FAF6EC";
    ctx.font = "700 26px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(cd ? "…" : "叫一声", barkBtn.x + barkBtn.w / 2, barkBtn.y + barkBtn.h / 2);
    if (cd) {
      const p = 1 - barkCD / 3;
      ctx.strokeStyle = "#FAF6EC";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(barkBtn.x + barkBtn.w / 2, barkBtn.y + barkBtn.h / 2, 30, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2);
      ctx.stroke();
    }
    // walk
    ctx.fillStyle = holding ? "#4A3226" : "#2A1C14";
    roundRect(walkBtn.x, walkBtn.y, walkBtn.w, walkBtn.h, 20);
    ctx.fill();
    ctx.fillStyle = "#FAF6EC";
    ctx.font = "700 30px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("按住前进", walkBtn.x + walkBtn.w / 2, walkBtn.y + walkBtn.h / 2);
    ctx.restore();

    if (hintT > 0) {
      const a = Math.min(1, hintT / 0.6, (5.5 - hintT) > 4.7 ? (5.5 - hintT) / 0.4 : 1);
      ctx.save();
      ctx.globalAlpha = a * 0.95;
      ctx.fillStyle = "rgba(42,28,20,0.82)";
      roundRect(70, 1028, 580, 72, 16);
      ctx.fill();
      ctx.fillStyle = "#FAF6EC";
      ctx.font = "500 22px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("行人从人和狗中间走过，绳子会断", 360, 1064);
      ctx.restore();
    }
    if (warnT > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, warnT * 4);
      ctx.fillStyle = "#C43C2A";
      ctx.font = "700 28px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("要走散了", 360, 130);
      ctx.restore();
    }
  }

  function panel(title, sub, buttons) {
    ctx.fillStyle = "rgba(32,20,16,0.45)";

    ctx.fillStyle = "#FAF6EC";
    ctx.strokeStyle = "#201410";

      ctx.fillText(sub, 360, 490);

  }

  }

  function drawPause() {
    overlayBtns.cont = { x: 180, y: 560, w: 360, h: 80 };
    overlayBtns.retry = { x: 180, y: 656, w: 360, h: 72 };
    panel("暂停", "", []);
    ctx.fillStyle = "#2A1C14";
    roundRect(180, 560, 360, 80, 18);
    ctx.fill();
    ctx.fillStyle = "#FAF6EC";
    ctx.font = "700 28px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("继续", 360, 600);
    ctx.strokeStyle = "#2A1C14";
    ctx.lineWidth = 2.5;
    ctx.fillStyle = "#FAF6EC";
    roundRect(180, 656, 360, 72, 18);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#2A1C14";
    ctx.font = "600 26px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("重新开始", 360, 692);
  }

  function drawFail() {
    overlayBtns.retry = { x: 180, y: 600, w: 360, h: 88 };
    panel("走散了", "绳子断了，人和狗被分开", []);
    ctx.fillStyle = "#2A1C14";
    roundRect(180, 600, 360, 88, 18);
    ctx.fill();
    ctx.fillStyle = "#FAF6EC";
    ctx.font = "700 28px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("再试一次", 360, 644);
  }

  function drawWin() {
    overlayBtns.retry = { x: 180, y: 640, w: 360, h: 88 };
    panel("到门口了", "", []);
    drawStars(360, 520, winStars, 48, true);
    ctx.fillStyle = "#5A4436";
    ctx.font = "500 22px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    const label = winStars === 3 ? "一路没走散" : winStars === 2 ? "有惊无险" : "差点走散";
    ctx.fillText(label, 360, 580);
    ctx.fillStyle = "#2A1C14";
    roundRect(180, 640, 360, 88, 18);
    ctx.fill();
    ctx.fillStyle = "#FAF6EC";
    ctx.font = "700 28px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillText("再玩一次", 360, 684);
  }

  /* ---------- physics ---------- */
  function distPointSeg(px, py, x1, y1, x2, y2) {
    const vx = x2 - x1, vy = y2 - y1;
    const l2 = vx * vx + vy * vy || 1;
    let t = ((px - x1) * vx + (py - y1) * vy) / l2;
    t = Math.max(0, Math.min(1, t));
    const qx = x1 + t * vx, qy = y1 + t * vy;
    return Math.hypot(px - qx, py - qy);
  }

  function update(dt) {
    if (state !== "play") return;
    time += dt;
    if (hintT > 0) hintT -= dt;
    if (barkCD > 0) barkCD = Math.max(0, barkCD - dt);
    if (barkFlash > 0) barkFlash = Math.max(0, barkFlash - dt);
    if (warnT > 0) warnT = Math.max(0, warnT - dt);

    const want = holding || keys.Space || keys.ArrowRight || keys.KeyD;
    boyVx = want ? WALK_SPEED : 0;
    const lead = want ? DOG_LEAD : 42;

    // boy vs npc block
    let blocked = false;
    for (const n of npcs) {
      if (n.asideY > 36) continue;
      const dx = n.x - boyX;
      if (dx > 20 && dx < 58 && boyVx > 0) {
        blocked = true;
        if (want) bumps += dt * 0.25;
      }
    }
    if (blocked) boyVx = 0;
    boyX += boyVx * dt;
    if (boyX < 160) boyX = 160;
    if (boyX > GATE_X + 10) boyX = GATE_X + 10;

    if (boyVx > 8) animT += dt;
    // dog follows a lead point, with lag
    const target = boyX + lead;
    const k = want ? 6.5 : 9;
    dogX += (target - dogX) * Math.min(1, k * dt);
    // if boy is stopped, dog slowly returns to lead
    if (Math.abs(dogX - target) > 1) dogAnimT += dt;
    else if (boyVx > 8) dogAnimT += dt;

    // leash constraint
    let h = handPos(), c = collarPos();
    let dist = Math.hypot(c.x - h.x, c.y - h.y);
    if (dist > LEASH_MAX) {
      const pull = (dist - LEASH_MAX);
      const ang = Math.atan2(c.y - h.y, c.x - h.x);
      dogX -= Math.cos(ang) * pull * 0.85;
      if (pull > 8) boyX += Math.cos(ang) * pull * 0.15;
    }

    // npcs
    for (const n of npcs) {
      if (n.aside > 0) {
        n.aside -= dt;
        n.asideY += (84 - n.asideY) * Math.min(1, 10 * dt);
      } else {
        n.asideY += (0 - n.asideY) * Math.min(1, 8 * dt);
        n.x += n.dir * n.speed * dt;
        n.phase += dt;
      }
    }

    // tension: npc on the leash
    h = handPos(); c = collarPos();
    let hit = false;
    for (const n of npcs) {
      if (n.asideY > 40) continue;
      const d = distPointSeg(n.x, GROUND - 70, h.x, h.y, c.x, c.y);
      const between = (n.x > Math.min(boyX, dogX) + 18) && (n.x < Math.max(boyX, dogX) - 18);
      if (between && d < 38) hit = true;
    }
    if (hit) {
      leashTension += dt;
      warnT = 0.6;
    } else {
      leashTension = Math.max(0, leashTension - dt * 1.6);
    }
    if (leashTension > maxTension) maxTension = leashTension;
    if (leashTension > 0.55) {
      // snap
      snapT = 0.01;
      snapX1 = h.x; snapY1 = h.y; snapX2 = c.x; snapY2 = c.y;
      state = "fail";
      holding = false;
      return;
    }

    // win
    if (boyX >= GATE_X - 8 && dogX >= GATE_X - 80) {
      winStars = starsEarned();
      state = "win";
      holding = false;
    }

    // camera
    const wantCam = boyX - 200;
    camX += (wantCam - camX) * Math.min(1, 6 * dt);
    if (camX < 0) camX = 0;
    if (camX > WORLD_END - W) camX = WORLD_END - W;
  }

  function render() {
    if (state === "title") {
      drawTitle();
      return;
    }
    drawBackground(camX);
    drawProps();
    // sort: npcs, leash, dog, boy — dog usually in front (right)
    const drawableNpcs = npcs.slice().sort((a, b) => a.x - b.x);
    for (const n of drawableNpcs) {
      if (n.x < dogX) drawNPC(n);
    }
    drawLeash(state === "fail");
    drawDog();
    drawBoy();
    for (const n of drawableNpcs) {
      if (n.x >= dogX) drawNPC(n);
    }
    if (state === "fail") {
      snapT += 1 / 60;
      drawLeash(true);
    }
    drawTopBar();
    drawBottom();
    if (state === "pause") drawPause();
    if (state === "fail") drawFail();
    if (state === "win") drawWin();
  }

  /* ---------- input ---------- */
  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    const ev = e.touches ? e.touches[0] || e.changedTouches[0] : e;
    return {
      x: (ev.clientX - r.left) * (W / r.width),
      y: (ev.clientY - r.top) * (H / r.height)
    };
  }

  function onDown(e) {
    e.preventDefault();
    const p = canvasPos(e);
    if (state === "title") {
      if (inRect(p.x, p.y, overlayBtns.start) || p.y > 900) {
        resetPlay();
        state = "play";
      }
      return;
    }
    if (state === "pause") {
      if (inRect(p.x, p.y, overlayBtns.cont)) { state = "play"; return; }
      if (inRect(p.x, p.y, overlayBtns.retry)) { resetPlay(); state = "play"; return; }
      return;
    }
    if (state === "fail" || state === "win") {
      if (inRect(p.x, p.y, overlayBtns.retry)) { resetPlay(); state = "play"; }
      return;
    }
    if (state === "play") {
      if (inRect(p.x, p.y, pauseBtn) || (p.x > 630 && p.y < 100)) {
        state = "pause";
        holding = false;
        return;
      }
      if (inRect(p.x, p.y, barkBtn)) {
        tryBark();
        return;
      }
      if (p.y > 200) holding = true;
    }
  }
  function onUp(e) {
    holding = false;
  }

  function tryBark() {
    if (state !== "play" || barkCD > 0) return;
    barkCD = 3;
    barkFlash = 0.7;
    barked++;
    for (const n of npcs) {
      const d = Math.min(Math.abs(n.x - boyX), Math.abs(n.x - dogX));
      if (d < 230) n.aside = 1.15;
    }
  }

  canvas.addEventListener("pointerdown", onDown);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("touchend", onUp);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "KeyP" && state === "play") { state = "pause"; holding = false; }
    else if (e.code === "KeyP" && state === "pause") state = "play";
    if ((e.code === "KeyB" || e.code === "KeyJ") && state === "play") tryBark();
    if (e.code === "Enter" && state === "title") { resetPlay(); state = "play"; }
    if (e.code === "Enter" && (state === "fail" || state === "win")) { resetPlay(); state = "play"; }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  let last = 0;
  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  loadAll().then(() => {
    resetPlay();
    state = "title";
    const h = String(location.hash || "").replace(/^#/, "");
    if (h === "play" || h === "walk" || h === "meet" || h === "man") {
      resetPlay();
      state = "play";
      if (h === "walk") holding = true;
      if (h === "meet") { boyX = 620; dogX = 620 + DOG_LEAD; camX = 420; holding = true; }
      if (h === "man") { boyX = 1320; dogX = 1320 + DOG_LEAD; camX = 1120; holding = true; }
    }
    if (h === "fail") { resetPlay(); state = "fail"; }
    if (h === "win") { resetPlay(); winStars = 3; state = "win"; }
    requestAnimationFrame(loop);
  }).catch((err) => {
    document.body.innerHTML = "<p style='color:#fff;font-family:sans-serif;padding:40px'>资源加载失败</p>";
    console.error(err);
  });
})();

</script>
</body>
</html>
